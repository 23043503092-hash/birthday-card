<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Sudha 🎂</title>
<style>
  :root{
    --kraft: #d9b98a;
    --kraft-dark: #c7a273;
    --maroon: #7a1f2b;
    --maroon-deep: #5c141d;
    --cream: #f6ecd9;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    background: var(--kraft);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.15) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.08) 0, transparent 45%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--maroon-deep);
    overflow-x: hidden;
  }
  .stage{
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: clamp(28px, 8vh, 90px);
    padding-bottom: 40px;
  }

  /* ---------- shared card sizing ---------- */
  .card-wrap{
    position: relative;
    width: min(88vw, 380px);
    aspect-ratio: 4 / 5;
    perspective: 2200px;
  }
  .card-wrap.open{
    width: min(94vw, 820px);
  }

  /* ---------- COVER ---------- */
  .cover-btn{
    position: absolute; inset: 0;
    border: none; padding: 0; margin: 0;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(40,10,10,0.35), 0 3px 10px rgba(40,10,10,0.25);
    transition: transform 0.45s cubic-bezier(.4,0,.2,1), opacity 0.45s ease, box-shadow 0.4s ease;
    transform-style: preserve-3d;
    background: #eee;
  }
  .cover-btn img{
    width: 100%; height: 100%; object-fit: cover; display:block;
    pointer-events: none;
  }
  .cover-hint{
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.88);
    color: var(--maroon-deep);
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 999px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    pointer-events: none;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: translateX(-50%) scale(1); }
    50%{ transform: translateX(-50%) scale(1.05); }
  }

  .card-wrap.opening .cover-btn{
    transform: scale(0.94);
    opacity: 0;
    pointer-events: none;
  }
  .card-wrap:not(.open) .cover-btn{
    opacity: 1;
  }

  /* ---------- SPREAD ---------- */
  .spread{
    position: absolute; inset: 0;
    display: none;
    border-radius: 10px;
    overflow: visible;
  }
  .card-wrap.open .spread{ display: block; }

  .book{
    position: absolute; inset: 0;
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 22px 50px rgba(40,10,10,0.4), 0 4px 14px rgba(40,10,10,0.3);
    background: var(--kraft);
    transform-origin: center center;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.5s ease 0.15s, transform 0.5s cubic-bezier(.2,.8,.3,1.1) 0.15s;
  }
  .card-wrap.open .book{
    opacity: 1;
    transform: scale(1);
  }

  .page{
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: var(--kraft);
  }
  .page-left{
    border-right: 2px solid rgba(90,20,25,0.25);
    box-shadow: inset -14px 0 24px -18px rgba(30,5,5,0.6);
  }
  .page-right{
    box-shadow: inset 14px 0 24px -18px rgba(30,5,5,0.6);
  }

  /* plaid corner decoration via CSS */
  .plaid-corner{
    position: absolute;
    width: 46%; height: 30%;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 10px, rgba(122,31,43,0.35) 10px 20px),
      repeating-linear-gradient(-45deg, transparent 0 10px, rgba(122,31,43,0.25) 10px 20px);
    background-color: var(--cream);
    opacity: 0.9;
  }
  .plaid-corner.tr{ top:-6%; right:-8%; transform: rotate(8deg); border-radius: 0 0 0 30px; }
  .plaid-corner.bl{ bottom:-6%; left:-8%; transform: rotate(8deg); border-radius: 30px 0 0 0; }

  .deco-star{
    position:absolute; font-size: 20px; color: var(--maroon);
    opacity: 0.85; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
  }
  .deco-heart{
    position:absolute; font-size: 18px; color: var(--maroon);
    opacity: 0.8;
  }

  /* ---------- LEFT PAGE: envelope + letter ---------- */
  .envelope-wrap{
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%,-50%);
    width: 74%;
    aspect-ratio: 709 / 1026;
    z-index: 3;
  }
  .envelope-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 10px 22px rgba(30,5,5,0.35);
  }
  .letter-el{
    position: absolute;
    left: 50%;
    width: 74%;
    aspect-ratio: 706 / 1026;
    top: 52%;
    transform: translate(-50%,-64%) rotate(-3deg);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.55s cubic-bezier(.3,.7,.25,1.05), width 0.55s cubic-bezier(.3,.7,.25,1.05), left 0.55s cubic-bezier(.3,.7,.25,1.05), top 0.55s cubic-bezier(.3,.7,.25,1.05), box-shadow 0.4s ease, z-index 0s 0.05s;
  }
  .letter-el img{
    width:100%; height:100%; object-fit: cover;
    border-radius: 3px;
    box-shadow: 0 6px 14px rgba(30,5,5,0.3);
    display:block;
  }
  .letter-el .tap-hint{
    position:absolute; top:4px; left:50%; transform: translateX(-50%);
    font-size: 10.5px; font-family: -apple-system, sans-serif; font-weight:700;
    background: rgba(122,31,43,0.92); color: #fff; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap; opacity: 0.95; pointer-events:none;
  }
  .letter-el.lifted{
    left: 50%;
    top: 50%;
    width: 88%;
    transform: translate(-50%,-50%) rotate(0deg);
    z-index: 10;
    box-shadow: 0 20px 45px rgba(20,5,5,0.5);
  }
  .letter-el.lifted img{
    box-shadow: 0 16px 34px rgba(20,5,5,0.45);
  }
  .letter-el.lifted .tap-hint{ opacity: 0; }

  .back-to-cover{
    position: absolute;
    top: -46px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    border: none;
    color: var(--maroon-deep);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease 0.3s, top 0.3s ease 0.3s;
  }
  .card-wrap.open .back-to-cover{
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- RIGHT PAGE: cake + candles ---------- */
  .cake-wrap{
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 92%;
    aspect-ratio: 1080/1350;
  }
  .cake-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: contain;
  }
  .flame{
    position: absolute;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 0 6px rgba(255,170,20,0.55));
    transition: opacity 0.35s ease;
    will-change: transform;
  }
  .flame img{ width:100%; height:100%; display:block; }
  .flame.out{ opacity: 0; }

  .meter-wrap{
    position: absolute;
    left: 50%; bottom: 6%;
    transform: translateX(-50%);
    width: 62%;
    z-index: 5;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .meter-label{
    font-size: 11px; font-weight: 700; color: var(--maroon-deep);
    background: rgba(255,255,255,0.85); padding: 3px 10px; border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .meter-bar{
    width: 100%; height: 10px;
    background: rgba(255,255,255,0.55);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(122,31,43,0.3);
  }
  .meter-fill{
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f6c453, #e8622c);
    border-radius: 999px;
    transition: width 0.08s linear;
  }
  .blow-fallback-btn{
    margin-top: 2px;
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    color: #fff;
    background: var(--maroon);
    border: none;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .blow-fallback-btn:active{ transform: scale(0.96); }
  .mic-note{
    font-size: 10px;
    color: rgba(92,20,29,0.75);
    text-align: center;
    max-width: 230px;
    line-height: 1.35;
  }

  .wish-overlay{
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(246,236,217,0.0);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease, background 0.5s ease;
    z-index: 20;
  }
  .wish-overlay.show{
    opacity: 1;
    background: rgba(246,236,217,0.55);
    pointer-events: auto;
  }
  .wish-card{
    background: #fff;
    padding: 22px 26px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(30,5,5,0.35);
    transform: scale(0.85) translateY(10px);
    transition: transform 0.45s cubic-bezier(.3,.9,.3,1.2);
    max-width: 84%;
  }
  .wish-overlay.show .wish-card{ transform: scale(1) translateY(0); }
  .wish-card h2{
    margin: 0 0 6px 0;
    color: var(--maroon);
    font-size: clamp(18px, 4vw, 24px);
  }
  .wish-card p{
    margin: 0 0 14px 0;
    font-size: 13px;
    color: #555;
    font-family: -apple-system, sans-serif;
  }
  .relight-btn{
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    background: var(--maroon);
    border: none;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
  }

  canvas.confetti-canvas{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 19;
  }

  .https-banner{
    position: fixed;
    left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(40,10,10,0.88);
    color: #fdf3e3;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 90vw;
    text-align: center;
    line-height: 1.4;
    z-index: 50;
    display: none;
  }
  .https-banner.show{ display: block; }

  @media (max-width: 480px){
    .card-wrap.open{ width: 94vw; aspect-ratio: 2/1.42; }
  }
</style>
</head>

<script>
(function(){
  'use strict';

  var USER_NAME = 'Sudha';

  /* ---------------- Element refs ---------------- */
  var cardWrap   = document.getElementById('cardWrap');
  var coverBtn   = document.getElementById('coverBtn');
  var backBtn    = document.getElementById('backBtn');
  var letterEl   = document.getElementById('letterEl');
  var cakeWrap   = document.getElementById('cakeWrap');
  var wishOverlay= document.getElementById('wishOverlay');
  var wishText   = document.getElementById('wishText');
  var relightBtn = document.getElementById('relightBtn');
  var meterFill  = document.getElementById('meterFill');
  var meterLabel = document.getElementById('meterLabel');
  var fallbackBtn= document.getElementById('fallbackBtn');
  var micNote    = document.getElementById('micNote');
  var httpsBanner= document.getElementById('httpsBanner');
  var confettiCanvas = document.getElementById('confettiCanvas');

  wishText.textContent = 'Make a wish, ' + USER_NAME + ' 🌟';

  /* ---------------- Cover open / close ---------------- */
  function openCard(){
    cardWrap.classList.add('opening');
    setTimeout(function(){
      cardWrap.classList.add('open');
    }, 60);
    // start audio setup lazily on first open (needs user gesture anyway)
    initAudioOnce();
  }
  function closeCard(){
    cardWrap.classList.remove('open');
    setTimeout(function(){
      cardWrap.classList.remove('opening');
    }, 480);
    // reset letter state when going back
    letterEl.classList.remove('lifted');
  }
  coverBtn.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  /* ---------------- Letter lift ---------------- */
  letterEl.addEventListener('click', function(){
    letterEl.classList.toggle('lifted');
  });

  /* ---------------- Build flame elements ---------------- */
  var flameEls = [];
  (function buildFlames(){
    var layout = window.FLAME_LAYOUT || [];
    var keys = ['flame1','flame2','flame3','flame4','flame5'];
    for(var i=0;i<layout.length;i++){
      var L = layout[i];
      var wrap = document.createElement('div');
      wrap.className = 'flame';
      wrap.style.left   = L.left + '%';
      wrap.style.top    = L.top + '%';
      wrap.style.width  = L.width + '%';
      wrap.style.height = L.height + '%';
      var img = document.createElement('img');
      img.src = (window.ASSETS && window.ASSETS[keys[i]]) || '';
      img.alt = 'flame';
      wrap.appendChild(img);
      cakeWrap.appendChild(wrap);
      flameEls.push({el: wrap, out: false, wobbleSeed: Math.random()*1000});
    }
  })();

  /* ---------------- Blow-out state machine ---------------- */
  var blowLevel = 0;          // 0..1 smoothed input level
  var blowingSince = null;    // timestamp when sustained blow started
  var candlesOutCount = 0;
  var allOut = false;
  var BLOW_THRESHOLD = 0.16;      // level considered "blowing"
  var SUSTAIN_MS = 500;           // how long to sustain before extinguishing
  var rafId = null;

  function setMeter(level){
    var pct = Math.max(0, Math.min(1, level)) * 100;
    meterFill.style.width = pct + '%';
  }

  function animateFlames(level, dt){
    var t = performance.now() / 1000;
    for(var i=0;i<flameEls.length;i++){
      var f = flameEls[i];
      if(f.out) continue;
      // natural gentle flicker + wind bend proportional to level
      var flicker = Math.sin(t*6 + f.wobbleSeed) * 2.2;
      var bend = level * 34; // degrees max bend
      var sway = Math.sin(t*10 + f.wobbleSeed) * level * 6;
      var angle = flicker + bend + sway;
      var scaleY = 1 - Math.min(level, 1) * 0.18;
      f.el.style.transform = 'rotate(' + angle.toFixed(2) + 'deg) scaleY(' + scaleY.toFixed(3) + ')';
    }
  }

  function extinguishAll(){
    if(allOut) return;
    allOut = true;
    for(var i=0;i<flameEls.length;i++){
      flameEls[i].out = true;
      flameEls[i].el.classList.add('out');
    }
    stopLoop();
    setTimeout(showWish, 350);
  }

  function relight(){
    allOut = false;
    blowingSince = null;
    blowLevel = 0;
    setMeter(0);
    for(var i=0;i<flameEls.length;i++){
      flameEls[i].out = false;
      flameEls[i].el.classList.remove('out');
      flameEls[i].el.style.transform = 'rotate(0deg) scaleY(1)';
    }
    wishOverlay.classList.remove('show');
    startLoop();
  }
  relightBtn.addEventListener('click', relight);

  function showWish(){
    wishOverlay.classList.add('show');
    launchConfetti();
  }

  /* ---------------- Main animation loop ---------------- */
  var lastT = performance.now();
  function loop(){
    var now = performance.now();
    var dt = now - lastT;
    lastT = now;

    // smooth the level toward target (targetLevel set by mic or fallback)
    var target = window.__targetBlowLevel || 0;
    blowLevel += (target - blowLevel) * 0.25;
    setMeter(blowLevel);
    animateFlames(blowLevel, dt);

    if(!allOut){
      if(blowLevel >= BLOW_THRESHOLD){
        if(blowingSince === null) blowingSince = now;
        if(now - blowingSince >= SUSTAIN_MS){
          extinguishAll();
        }
      } else {
        blowingSince = null;
      }
    }

    rafId = requestAnimationFrame(loop);
  }
  function startLoop(){
    if(rafId === null){
      lastT = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }
  function stopLoop(){
    if(rafId !== null){
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    setMeter(0);
  }
  startLoop();

  /* ---------------- Web Audio mic blow detection ---------------- */
  window.__targetBlowLevel = 0;
  var audioCtx = null, analyser = null, micStream = null, micData = null;
  var micActive = false;
  var audioInitStarted = false;

  function isSecureEnough(){
    return window.isSecureContext === true;
  }

  function initAudioOnce(){
    if(audioInitStarted) return;
    audioInitStarted = true;

    if(!isSecureEnough()){
      showHttpsWarning();
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showHttpsWarning('Microphone access isn\'t available in this browser context. Use the button (or hold spacebar) to blow instead.');
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      } })
      .then(function(stream){
        micStream = stream;
        var AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.6;
        micData = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        micActive = true;
        meterLabel.textContent = 'Blow into your mic to blow out the candles 💨';
        fallbackBtn.textContent = 'Mic blocked? Hold this to blow (or press space)';
        pollMic();
      })
      .catch(function(err){
        showHttpsWarning('Mic access was blocked or unavailable (' + (err && err.name ? err.name : 'error') + '). Use the button below (or hold spacebar) to blow instead.');
      });
  }

  function pollMic(){
    if(!micActive) return;
    analyser.getByteTimeDomainData(micData);
    // compute RMS of deviation from 128 (silence)
    var sumSquares = 0;
    for(var i=0;i<micData.length;i++){
      var v = (micData[i] - 128) / 128;
      sumSquares += v*v;
    }
    var rms = Math.sqrt(sumSquares / micData.length); // ~0 to ~0.6 typical
    // scale/clip to a nice 0..1 range for blowing sensitivity
    var level = Math.min(1, rms * 4.2);
    window.__targetBlowLevel = fallbackHeld ? Math.max(level, fallbackLevel) : level;
    requestAnimationFrame(pollMic);
  }

  function showHttpsWarning(customMsg){
    var msg = customMsg || 'Microphone blowing needs HTTPS. Open this card from a hosted link (not a local file) for mic support — meanwhile, use the button below or hold spacebar to blow.';
    micNote.textContent = msg;
    httpsBanner.textContent = 'Tip: host this file over HTTPS to enable real mic-blow detection. The hold-to-blow button always works.';
    httpsBanner.classList.add('show');
    meterLabel.textContent = 'Use the button (or hold spacebar) to blow 💨';
    setTimeout(function(){ httpsBanner.classList.remove('show'); }, 6500);
  }

  /* ---------------- Fallback: hold-to-blow button / spacebar ---------------- */
  var fallbackHeld = false;
  var fallbackLevel = 0;
  var fallbackRampId = null;

  function fallbackStart(){
    if(fallbackHeld) return;
    fallbackHeld = true;
    rampFallback();
  }
  function fallbackStop(){
    fallbackHeld = false;
    fallbackLevel = 0;
    if(!micActive) window.__targetBlowLevel = 0;
  }
  function rampFallback(){
    if(!fallbackHeld) return;
    fallbackLevel = Math.min(1, fallbackLevel + 0.06);
    if(!micActive){
      window.__targetBlowLevel = fallbackLevel;
    } else {
      window.__targetBlowLevel = Math.max(window.__targetBlowLevel, fallbackLevel);
    }
    fallbackRampId = requestAnimationFrame(rampFallback);
  }

  fallbackBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); fallbackStart(); });
  fallbackBtn.addEventListener('pointerup', fallbackStop);
  fallbackBtn.addEventListener('pointerleave', fallbackStop);
  fallbackBtn.addEventListener('pointercancel', fallbackStop);
  fallbackBtn.addEventListener('touchstart', function(e){ e.preventDefault(); fallbackStart(); }, {passive:false});
  fallbackBtn.addEventListener('touchend', function(e){ e.preventDefault(); fallbackStop(); }, {passive:false});

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.key === ' '){
      if(cardWrap.classList.contains('open')){
        e.preventDefault();
        fallbackStart();
      }
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      fallbackStop();
    }
  });

  /* ---------------- Confetti ---------------- */
  var confettiCtx = confettiCanvas.getContext && confettiCanvas.getContext('2d');
  var confettiParticles = [];
  var confettiRunning = false;
  var confettiColors = ['#e8622c','#f6c453','#7a1f2b','#f2a6b0','#7fb069','#5aa9e6'];

  function resizeConfettiCanvas(){
    var rect = cakeWrap.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width * devicePixelRatio;
    confettiCanvas.height = rect.height * devicePixelRatio;
    confettiCanvas.style.width = rect.width + 'px';
    confettiCanvas.style.height = rect.height + 'px';
  }

  function launchConfetti(){
    if(!confettiCtx) return;
    resizeConfettiCanvas();
    var W = confettiCanvas.width, H = confettiCanvas.height;
    confettiParticles = [];
    var count = 90;
    for(var i=0;i<count;i++){
      confettiParticles.push({
        x: W/2 + (Math.random()-0.5)*W*0.3,
        y: H*0.25 + (Math.random()-0.5)*H*0.1,
        vx: (Math.random()-0.5) * 6 * devicePixelRatio,
        vy: (Math.random()*-6 - 2) * devicePixelRatio,
        size: (Math.random()*6+4) * devicePixelRatio,
        color: confettiColors[i % confettiColors.length],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        gravity: 0.18 * devicePixelRatio,
        life: 0,
        maxLife: 130 + Math.random()*60
      });
    }
    if(!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(confettiLoop);
    }
  }

  function confettiLoop(){
    if(!confettiCtx){ confettiRunning = false; return; }
    var W = confettiCanvas.width, H = confettiCanvas.height;
    confettiCtx.clearRect(0,0,W,H);
    var alive = false;
    for(var i=0;i<confettiParticles.length;i++){
      var p = confettiParticles[i];
      if(p.life >= p.maxLife) continue;
      alive = true;
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      var fade = 1 - Math.max(0, (p.life - p.maxLife*0.7) / (p.maxLife*0.3));
      confettiCtx.save();
      confettiCtx.globalAlpha = Math.max(0, Math.min(1, fade));
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      confettiCtx.restore();
    }
    if(alive && wishOverlay.classList.contains('show')){
      requestAnimationFrame(confettiLoop);
    } else {
      confettiCtx.clearRect(0,0,W,H);
      confettiRunning = false;
    }
  }

  window.addEventListener('resize', function(){
    if(wishOverlay.classList.contains('show')) resizeConfettiCanvas();
  });

})();

</script>
